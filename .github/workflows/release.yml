name: Release

on:
    pull_request:
        types: [closed]
    workflow_dispatch:
        inputs:
            version:
                description: "Version to release (e.g., major.minor.patch)"
                required: true
                type: string

jobs:
    release:
        if: >-
            (
                github.event_name == 'pull_request' &&
                github.event.pull_request.merged == true &&
                github.event.pull_request.head.repo.full_name == github.repository &&
                startsWith(github.event.pull_request.head.ref, 'release/')
            ) ||
            github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        permissions:
            contents: write # create the tag, release, and read the repo
            id-token: write # npm OIDC trusted publishing
        steps:
            - uses: actions/checkout@v4
              with:
                  # Checkout merge commit for PRs, or main branch for manual runs
                  ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || 'main' }}
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org
                  cache: "pnpm"

            # Dynamically pull version from input if manual, or read package.json if PR
            - name: Read version
              id: version
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
                  else
                    echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
                  fi

            - name: Create tag
              uses: actions/github-script@v8
              with:
                  script: |
                      const sha = context.payload.pull_request 
                        ? context.payload.pull_request.merge_commit_sha 
                        : context.sha;
                      
                      await github.rest.git.createRef({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        ref: `refs/tags/v${{ steps.version.outputs.version }}`,
                        sha: sha,
                      })

            - name: Fetch tags
              run: git fetch --tags

            - run: pnpm ci
            - run: pnpm run build --if-present

            # Generate the GitHub Release notes from conventional commits
            - run: pnpm dlx changelogithub
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Publish with npm OIDC trusted publishing (no NPM_TOKEN needed).
            - run: pnpm publish